<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DialBot — Reseller Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --dark:#0F1117;--teal:#00C48C;--orange:#FF6B2B;
  --bg:#F7F8FA;--white:#FFFFFF;--border:#E8EAF0;
  --text:#0F1117;--muted:#7A7F8E;--red:#DC2626;
  --silver:#4A5568;--gold:#D97706;--plat:#374151;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--dark)}
.login-box{background:var(--white);border-radius:16px;padding:40px;width:400px;box-shadow:0 8px 48px rgba(0,0,0,.3)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .brand{font-size:28px;font-weight:900;color:var(--dark)}
.login-logo .brand span{color:var(--teal)}
.login-logo .sub{font-size:12px;color:var(--muted);margin-top:4px}
.login-box h2{font-size:18px;font-weight:700;margin-bottom:20px;text-align:center}
.form-group{margin-bottom:14px}
.form-group label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.form-group input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--text)}
.form-group input:focus{outline:none;border-color:var(--teal)}
.btn-login{width:100%;background:var(--teal);color:var(--dark);border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-login:hover{opacity:.9}
.login-error{background:#FEF2F2;color:var(--red);border-radius:8px;padding:10px;font-size:12px;margin-bottom:12px;display:none}

/* APP SHELL */
.app{display:none;height:100vh;display:none;flex-direction:column}
.topbar{background:var(--dark);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-brand{font-size:16px;font-weight:800;color:#fff}
.tb-brand span{color:var(--teal)}
.tb-brand sub{font-size:10px;color:rgba(255,255,255,.4);font-weight:400;margin-left:6px}
.tb-right{display:flex;align-items:center;gap:16px}
.tb-plan{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700}
.plan-silver{background:rgba(74,85,104,.2);color:#94A3B8}
.plan-gold{background:rgba(217,119,6,.2);color:#F59E0B}
.plan-platinum{background:rgba(0,196,140,.15);color:var(--teal)}
.tb-user{font-size:12px;color:rgba(255,255,255,.5)}
.btn-logout{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);padding:4px 12px;border-radius:6px;font-size:11px;cursor:pointer}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--white);border-right:1px solid var(--border);padding:16px 0;flex-shrink:0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);border-left:3px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:rgba(0,196,140,.08);color:var(--teal);border-left-color:var(--teal);font-weight:600}
.nav-icon{font-size:16px;width:20px;text-align:center}
.main{flex:1;overflow-y:auto;padding:24px}

/* CARDS */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:14px;font-weight:700}
.card-body{padding:18px}

/* USAGE BAR */
.usage-bar-wrap{background:var(--bg);border-radius:8px;height:10px;overflow:hidden;margin:8px 0}
.usage-bar{height:100%;border-radius:8px;transition:width .5s}
.bar-ok{background:var(--teal)}
.bar-warn{background:var(--orange)}
.bar-over{background:var(--red)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--border)}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border)}
.data-table tr:last-child td{border:none}
.data-table tr:hover td{background:var(--bg)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-active{background:#EBF8F1;color:#007A58}
.badge-suspended{background:#FEF2F2;color:var(--red)}

/* BUTTONS */
.btn{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn-primary{background:var(--teal);color:var(--dark)}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-danger{background:none;border:1px solid var(--red);color:var(--red)}
.btn:hover{opacity:.85}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--white);border-radius:16px;padding:28px;width:480px;max-width:95vw}
.modal h3{font-size:16px;font-weight:700;margin-bottom:20px}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text);margin-bottom:12px}
.modal-input:focus{outline:none;border-color:var(--teal)}
.modal-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;max-width:320px}
.toast.show{opacity:1}
.toast.success{border-left:4px solid var(--teal)}
.toast.error{border-left:4px solid var(--red)}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="brand">Dial<span>Bot</span></div>
      <div class="sub">Reseller Portal</div>
    </div>
    <div class="login-error" id="login-error"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@company.com" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In →</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app-screen">
  <!-- Topbar -->
  <div class="topbar">
    <div class="tb-brand">Dial<span>Bot</span><sub>Reseller Portal</sub></div>
    <div class="tb-right">
      <span class="tb-plan" id="tb-plan-badge"></span>
      <span class="tb-user" id="tb-user-name"></span>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>
  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="nav-item active" onclick="showPage('dashboard',this)"><span class="nav-icon">📊</span> Dashboard</div>
      <div class="nav-item" onclick="showPage('tenants',this)"><span class="nav-icon">🏢</span> My Clients</div>
      <div class="nav-item" onclick="showPage('usage',this)"><span class="nav-icon">⏱</span> Usage</div>
      <div class="nav-item" onclick="showPage('settings',this)"><span class="nav-icon">⚙️</span> Settings</div>
    </div>
    <!-- Main -->
    <div class="main" id="main-content">
      <div style="text-align:center;padding:60px;color:var(--muted)">Loading…</div>
    </div>
  </div>
</div>

<!-- CREATE TENANT MODAL -->
<div class="modal-overlay" id="modal-create-tenant">
  <div class="modal">
    <h3>Add New Client</h3>
    <label class="modal-label">Company Name *</label>
    <input class="modal-input" id="ct-company" placeholder="Acme Corp"/>
    <label class="modal-label">Contact Name</label>
    <input class="modal-input" id="ct-contact" placeholder="John Doe"/>
    <label class="modal-label">Email (used as login)</label>
    <input class="modal-input" id="ct-email" placeholder="john@acme.com" type="email"/>
    <label class="modal-label">Password (leave blank to auto-generate)</label>
    <input class="modal-input" id="ct-password" placeholder="auto-generated if blank" type="text"/>
    <label class="modal-label">Plan</label>
    <select class="modal-input" id="ct-plan">
      <option value="starter">Starter</option>
      <option value="growth" selected>Growth</option>
      <option value="pro">Pro</option>
    </select>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('modal-create-tenant')">Cancel</button>
      <button class="btn btn-primary" onclick="createTenant()">Create Client</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';
let _token = localStorage.getItem('reseller_token') || '';
let _me    = JSON.parse(localStorage.getItem('reseller_me') || 'null');

// ── AUTH ──────────────────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try {
    const r = await fetch('/reseller/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const d = await r.json();
    if (!r.ok) { errEl.textContent = d.detail || 'Login failed'; errEl.style.display='block'; return; }
    _token = d.token; _me = d;
    localStorage.setItem('reseller_token', _token);
    localStorage.setItem('reseller_me', JSON.stringify(_me));
    initApp();
  } catch(e) {
    errEl.textContent = 'Connection error'; errEl.style.display='block';
  }
}

function doLogout() {
  localStorage.removeItem('reseller_token');
  localStorage.removeItem('reseller_me');
  _token=''; _me=null;
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function apiFetch(url, opts={}) {
  return fetch(API + url, {
    ...opts,
    headers: {'Authorization': `Bearer ${_token}`, 'Content-Type':'application/json', ...(opts.headers||{})}
  }).then(async r => {
    if (r.status === 401) { doLogout(); throw new Error('Session expired'); }
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || 'API error');
    return d;
  });
}

// ── INIT ──────────────────────────────────────────────────
function initApp() {
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='flex';
  // Topbar
  const planColors = {silver:'plan-silver', gold:'plan-gold', platinum:'plan-platinum'};
  const badge = document.getElementById('tb-plan-badge');
  badge.textContent = (_me?.plan || 'silver').toUpperCase();
  badge.className   = `tb-plan ${planColors[_me?.plan] || 'plan-silver'}`;
  document.getElementById('tb-user-name').textContent = _me?.name || _me?.email || '';
  showPage('dashboard', document.querySelector('.nav-item'));
}

// ── NAV ───────────────────────────────────────────────────
function showPage(page, el) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  const main = document.getElementById('main-content');
  main.innerHTML = '<div style="text-align:center;padding:60px;color:var(--muted)">Loading…</div>';
  if (page==='dashboard') loadDashboard();
  else if (page==='tenants') loadTenants();
  else if (page==='usage') loadUsage();
  else if (page==='settings') loadSettings();
}

// ── DASHBOARD ─────────────────────────────────────────────
async function loadDashboard() {
  const [profile, usage] = await Promise.all([
    apiFetch('/reseller/api/profile'),
    apiFetch('/reseller/api/usage'),
  ]);
  const r     = profile.reseller;
  const quota = profile.quota;
  const gate  = profile.plan_info;
  const pct   = quota.pct || 0;
  const barCls= pct>=100?'bar-over':pct>=80?'bar-warn':'bar-ok';

  document.getElementById('main-content').innerHTML = `
    <div style="font-size:22px;font-weight:800;margin-bottom:20px">Dashboard</div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-num" style="color:var(--teal)">${quota.used?.toLocaleString()||0}</div>
        <div class="stat-lbl">Minutes Used (Month)</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${quota.limit?.toLocaleString()||0}</div>
        <div class="stat-lbl">Minutes Included</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--orange)">${quota.calls||0}</div>
        <div class="stat-lbl">Calls This Month</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${quota.remaining?.toLocaleString()||0}</div>
        <div class="stat-lbl">Minutes Remaining</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Monthly Minute Quota</div>
        <span style="font-size:12px;color:${pct>=100?'var(--red)':pct>=80?'var(--orange)':'var(--teal)'};font-weight:700">${pct}%</span>
      </div>
      <div class="card-body">
        <div class="usage-bar-wrap"><div class="usage-bar ${barCls}" style="width:${Math.min(pct,100)}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
          <span>${quota.used?.toLocaleString()||0} min used</span>
          <span>${quota.limit?.toLocaleString()||0} min limit</span>
        </div>
        ${pct>=80?`<div style="margin-top:10px;padding:10px;background:${pct>=100?'#FEF2F2':'#FFFBEB'};border-radius:8px;font-size:12px;color:${pct>=100?'var(--red)':'#92400E'}">
          ${pct>=100?'🚨 Quota exceeded — outbound calls paused. Contact support to top up.':'⚠️ Approaching limit. Consider requesting a top-up.'}
        </div>`:''}
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Your Plan: ${r.plan?.toUpperCase()}</div>
      </div>
      <div class="card-body" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        ${[
          ['Phone Numbers', r.max_numbers],
          ['Channels/Number', r.max_channels],
          ['Concurrent Calls', r.max_concurrent],
          ['Max Tenants', r.max_tenants===0?'Unlimited':r.max_tenants],
          ['Outbound Rate', '₹'+r.outbound_rate+'/min'],
          ['Inbound Rate', '₹'+r.inbound_rate+'/min'],
        ].map(([l,v])=>`
          <div style="background:var(--bg);border-radius:8px;padding:12px">
            <div style="font-size:11px;color:var(--muted)">${l}</div>
            <div style="font-size:16px;font-weight:700;margin-top:2px">${v}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
}

// ── TENANTS ───────────────────────────────────────────────
async function loadTenants() {
  const d = await apiFetch('/reseller/api/tenants');
  const tenants = d.tenants || [];
  const gate    = d.tenant_gate || {};
  document.getElementById('main-content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div>
        <div style="font-size:22px;font-weight:800">My Clients</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${tenants.length} clients · Limit: ${gate.limit||'—'}</div>
      </div>
      ${gate.allowed ? `<button class="btn btn-primary" onclick="openCreateTenant()">+ Add Client</button>`
        : `<button class="btn btn-outline" disabled title="${gate.reason}" style="opacity:.5;cursor:not-allowed">+ Add Client (limit reached)</button>`}
    </div>
    <div class="card">
      <table class="data-table">
        <thead><tr>
          <th>Company</th><th>Plan</th><th>Status</th>
          <th>Calls Today</th><th>Min Today</th><th>Actions</th>
        </tr></thead>
        <tbody>
        ${tenants.length ? tenants.map(t=>`
          <tr>
            <td><div style="font-weight:600">${t.name}</div><div style="font-size:11px;color:var(--muted)">${t.slug}</div></td>
            <td><span style="text-transform:capitalize">${t.plan}</span></td>
            <td><span class="badge badge-${t.status}">${t.status}</span></td>
            <td>${t.calls_today||0}</td>
            <td>${(t.minutes_today||0).toFixed(1)} min</td>
            <td>
              ${t.status==='active'
                ?`<button class="btn btn-danger" style="font-size:11px;padding:4px 10px" onclick="updateTenantStatus(${t.id},'suspended')">Suspend</button>`
                :`<button class="btn btn-outline" style="font-size:11px;padding:4px 10px" onclick="updateTenantStatus(${t.id},'active')">Activate</button>`}
            </td>
          </tr>`).join('')
          : `<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No clients yet. Add your first client above.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

// ── USAGE ─────────────────────────────────────────────────
async function loadUsage() {
  const d = await apiFetch('/reseller/api/usage');
  const quota = d.quota || {};
  const daily = d.daily || [];
  const perT  = d.per_tenant || [];
  document.getElementById('main-content').innerHTML = `
    <div style="font-size:22px;font-weight:800;margin-bottom:20px">Usage</div>
    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat-card"><div class="stat-num" style="color:var(--teal)">${quota.used?.toLocaleString()||0}</div><div class="stat-lbl">Minutes Used</div></div>
      <div class="stat-card"><div class="stat-num">${quota.calls||0}</div><div class="stat-lbl">Calls This Month</div></div>
      <div class="stat-card"><div class="stat-num">${quota.remaining?.toLocaleString()||0}</div><div class="stat-lbl">Minutes Remaining</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Per-Client Usage (Today)</div></div>
      <table class="data-table">
        <thead><tr><th>Client</th><th>Calls Today</th><th>Minutes Today</th></tr></thead>
        <tbody>
        ${perT.length ? perT.map(t=>`
          <tr>
            <td>${t.tenant_name}</td>
            <td>${t.calls_today}</td>
            <td>${(t.minutes_today||0).toFixed(1)} min</td>
          </tr>`).join('')
          : `<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--muted)">No usage data today</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Daily Usage (Last 30 Days)</div></div>
      <table class="data-table">
        <thead><tr><th>Date</th><th>Calls</th><th>Minutes</th></tr></thead>
        <tbody>
        ${daily.length ? daily.slice().reverse().slice(0,14).map(r=>`
          <tr>
            <td>${r.date}</td><td>${r.calls}</td>
            <td>${parseFloat(r.minutes||0).toFixed(1)}</td>
          </tr>`).join('')
          : `<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--muted)">No usage history</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

// ── SETTINGS ──────────────────────────────────────────────
async function loadSettings() {
  const d = await apiFetch('/reseller/api/profile');
  const r = d.reseller;
  document.getElementById('main-content').innerHTML = `
    <div style="font-size:22px;font-weight:800;margin-bottom:20px">Settings</div>
    <div class="card" style="max-width:520px">
      <div class="card-header"><div class="card-title">Account Settings</div></div>
      <div class="card-body">
        <div class="form-group" style="margin-bottom:14px">
          <label style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Company Name</label>
          <input id="set-company" class="modal-input" value="${r.company_name||''}" placeholder="Your company name"/>
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Telegram Bot Token (for alerts)</label>
          <input id="set-tg-token" class="modal-input" value="${r.telegram_bot_token||''}" placeholder="bot:token"/>
        </div>
        <div class="form-group" style="margin-bottom:14px">
          <label style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px">Telegram Chat ID</label>
          <input id="set-tg-chat" class="modal-input" value="${r.telegram_chat_id||''}" placeholder="-100xxxxxxxxxx"/>
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>
    <div class="card" style="max-width:520px;margin-top:16px">
      <div class="card-header"><div class="card-title">Account Info</div></div>
      <div class="card-body" style="font-size:13px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><div style="color:var(--muted);font-size:11px">Email</div><div>${r.email}</div></div>
          <div><div style="color:var(--muted);font-size:11px">Plan</div><div style="text-transform:capitalize;font-weight:600">${r.plan}</div></div>
          <div><div style="color:var(--muted);font-size:11px">API Key</div><div style="font-family:monospace;font-size:11px">${(r.api_key||'').slice(0,16)}…</div></div>
          <div><div style="color:var(--muted);font-size:11px">Next Billing</div><div>${r.next_billing_date||'—'}</div></div>
        </div>
        <div style="margin-top:14px;padding:12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--muted)">
          To upgrade your plan or add minutes, contact us at <strong>hello@dialbotpro.com</strong>
        </div>
      </div>
    </div>
  `;
}

async function saveSettings() {
  const body = {
    company_name:       document.getElementById('set-company')?.value?.trim(),
    telegram_bot_token: document.getElementById('set-tg-token')?.value?.trim(),
    telegram_chat_id:   document.getElementById('set-tg-chat')?.value?.trim(),
  };
  await apiFetch('/reseller/api/profile', {method:'PUT', body:JSON.stringify(body)});
  showToast('✅ Settings saved', 'success');
}

// ── TENANT CRUD ───────────────────────────────────────────
function openCreateTenant() {
  ['ct-company','ct-contact','ct-email','ct-password'].forEach(id=>{
    document.getElementById(id).value='';
  });
  document.getElementById('ct-plan').value='growth';
  document.getElementById('modal-create-tenant').classList.add('open');
}

async function createTenant() {
  const company = document.getElementById('ct-company').value.trim();
  if (!company) { showToast('Company name is required','error'); return; }
  try {
    const r = await apiFetch('/reseller/api/tenants', {
      method:'POST',
      body: JSON.stringify({
        company_name: company,
        contact_name: document.getElementById('ct-contact').value.trim(),
        email:        document.getElementById('ct-email').value.trim(),
        password:     document.getElementById('ct-password').value.trim() || undefined,
        plan:         document.getElementById('ct-plan').value,
      })
    });
    closeModal('modal-create-tenant');
    showToast(`✅ Client '${company}' created! Login: ${r.credentials?.username} / ${r.credentials?.password}`, 'success');
    loadTenants();
  } catch(e) { showToast(e.message,'error'); }
}

async function updateTenantStatus(tid, status) {
  if (!confirm(`${status==='suspended'?'Suspend':'Activate'} this client?`)) return;
  await apiFetch(`/reseller/api/tenants/${tid}/status`, {
    method:'PUT', body: JSON.stringify({status})
  });
  showToast(`✅ Client ${status}`, 'success');
  loadTenants();
}

// ── HELPERS ───────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'), 4000);
}

// ── BOOT ──────────────────────────────────────────────────
if (_token && _me) {
  initApp();
} else {
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
}
</script>
</body>
</html>
